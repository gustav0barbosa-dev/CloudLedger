name: Deploy AWS (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Nome do ambiente/prefixo dos recursos
        required: true
        default: dev
        type: string
      stackName:
        description: Nome da stack CloudFormation
        required: true
        default: cloudledger-dev
        type: string
      region:
        description: Região AWS
        required: true
        default: us-east-1
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Publicar stack, imagens e frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Deploy
        shell: pwsh
        env:
          STACK_NAME: ${{ inputs.stackName }}
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          REGION: ${{ inputs.region }}
          CLOUDLEDGER_DB_PASSWORD: ${{ secrets.CLOUDLEDGER_DB_PASSWORD }}
          CLOUDLEDGER_JWT_KEY: ${{ secrets.CLOUDLEDGER_JWT_KEY }}
          CLOUDLEDGER_MONGO_URI: ${{ secrets.CLOUDLEDGER_MONGO_URI }}
          CLOUDLEDGER_ALARM_EMAIL: ${{ secrets.CLOUDLEDGER_ALARM_EMAIL }}
        run: |
          pwsh scripts/deploy-aws.ps1 `
            -StackName "$STACK_NAME" `
            -EnvironmentName "$ENVIRONMENT_NAME" `
            -Region "$REGION"
