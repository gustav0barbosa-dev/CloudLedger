name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudledger
          POSTGRES_USER: cloudledger
          POSTGRES_PASSWORD: cloudledger_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore CloudLedger.sln
      - name: Build
        run: dotnet build CloudLedger.sln --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/CloudLedger.UnitTests/CloudLedger.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit.trx"
      - name: Integration tests
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=cloudledger;Username=cloudledger;Password=cloudledger_dev
          Database__Provider: Postgres
          Database__AutoMigrate: 'true'
          Mongo__Enabled: 'false'
          Aws__Enabled: 'false'
          RateLimiting__Auth__PermitLimit: '1000'
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet test tests/CloudLedger.IntegrationTests/CloudLedger.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration.trx"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/cloudledger-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/cloudledger-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false