@if (auth.isAuthenticated()) {
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>CloudLedger</div>
    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active">Visão geral</a>
      <a routerLink="/accounts" routerLinkActive="active">Contas</a>
      <a routerLink="/transactions" routerLinkActive="active">Lançamentos</a>
      <a routerLink="/transfers" routerLinkActive="active">Transferências</a>
      <a routerLink="/recurring" routerLinkActive="active">Recorrentes</a>
      <a routerLink="/goals" routerLinkActive="active">Metas</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn">🔔<span class="dot"></span></button>
      <div class="avatar">👤</div>
      <button class="btn secondary" (click)="logout()">Sair</button>
    </div>
  </header>
  <aside class="sidebar">
    <button class="side-btn active" title="Início">🏠</button>
    <button class="side-btn" title="Contas">💳</button>
    <button class="side-btn" title="Lançamentos">📊</button>
    <button class="side-btn" title="Metas">🎯</button>
    <div class="side-spacer"></div>
    <button class="side-btn" title="Configurações">⚙️</button>
  </aside>
  <main class="main">
    <div class="content">
      <router-outlet />
    </div>
  </main>
</div>
} @else {
  <router-outlet />
}
